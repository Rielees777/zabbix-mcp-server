type: Deployment
strategy:
  type: Recreate
containers:
  zabbix-mcp-server:
    name: zabbix-mcp-server
    repository: ""
    tag: ""
    runAsUser: 65534
    ports:
      - name: http
        containerPort: 8000
    # Measured ~80 MiB resident with the core tools; tool responses add on top.
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "250m"


runAsUser: "65534"
readOnlyRootFilesystem: "true"
emptyDir:
  - name: tmp
    mountPath: /tmp

# Same layout as netbox-mcp. Nothing here is secret: in per_request_token mode every user
# sends their own Zabbix tokens (X-MCP-Token-UT, X-MCP-Token-UTS) through the gateway.
env:
  CI_COMMIT_SHORT_SHA: ""
  ZABBIX_MCP_SERVER__TRANSPORT: "http"
  ZABBIX_MCP_SERVER__HOST: "0.0.0.0"
  ZABBIX_MCP_SERVER__PORT: "8000"
  ZABBIX_MCP_SERVER__LOG_LEVEL: "info"
  ZABBIX_MCP_SERVER__AUTH_MODE: "per_request_token"
  ZABBIX_MCP_SERVER__ALLOWED_REQUEST_BY: "personal"
  # Tool groups (README, "Token Budget"); core = 16 tools.
  ZABBIX_MCP_SERVER__TOOLS: "core,availability,notifications,analytics,inventory,problems_raw"
  ZABBIX_MCP_ZABBIX_SERVERS__UT__URL: "https://zabbix-ut.sovcombank.group"
  ZABBIX_MCP_ZABBIX_SERVERS__UT__TOKEN_HEADER: "X-MCP-Token-UT"
  ZABBIX_MCP_ZABBIX_SERVERS__UTS__URL: "https://uhq-zbx-uts-web1.sovcombank.group"
  ZABBIX_MCP_ZABBIX_SERVERS__UTS__TOKEN_HEADER: "X-MCP-Token-UTS"

service:
  zabbix-mcp-server:
    ports:
      - servicePortName: http
        servicePort: 8000

ingress:
  zabbix-mcp-server:
    class: nginx
    host:
      - name: "zbx-mcp-test.sovcombank.group"
        path:
          - uri: "/"
            serviceName: zabbix-mcp-server
            servicePort: 8000

imagePullSecrets: ""
rollme: "true"

diagnosticMode:
  enable: "false"
  command: ["sleep"]
  args: ["infinity"]
