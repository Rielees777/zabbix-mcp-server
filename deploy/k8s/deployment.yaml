# Zabbix MCP Server on Kubernetes with secrets from HashiCorp Vault.
#
# The server reads only environment variables and files, it never talks to
# Vault itself. Two ways to hand it the secrets are shown, pick ONE:
#
#   A. Vault Agent Injector  - this file (annotations below): the sidecar
#      renders one file per secret under /vault/secrets, which the server
#      reads like environment variables of the same name (lower case).
#   B. Vault Secrets Operator / External Secrets - see external-secret.yaml:
#      Vault -> Kubernetes Secret -> envFrom. Drop the vault.hashicorp.com
#      annotations and enable the envFrom block instead.
#
# Adjust the image, the namespace, the Vault role and the secret paths.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zabbix-mcp-config
data:
  # Non-secret settings.
  ZABBIX_MCP_SERVER__TRANSPORT: "http"
  ZABBIX_MCP_SERVER__HOST: "0.0.0.0"
  ZABBIX_MCP_SERVER__PORT: "8080"
  ZABBIX_MCP_SERVER__PUBLIC_URL: "https://mcp.example.com"
  ZABBIX_MCP_ZABBIX_SERVERS__PROD__URL: "https://zabbix.example.com"
  ZABBIX_MCP_ZABBIX_SERVERS__PROD__READ_ONLY: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-mcp-server
  labels: { app: zabbix-mcp-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: zabbix-mcp-server }
  template:
    metadata:
      labels: { app: zabbix-mcp-server }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "zabbix-mcp"
        # One injected file per secret. The file name is the variable name in lower case.
        vault.hashicorp.com/agent-inject-secret-zabbix_mcp_zabbix_servers__prod__api_token: "kv/data/zabbix-mcp/prod"
        vault.hashicorp.com/agent-inject-template-zabbix_mcp_zabbix_servers__prod__api_token: |
          {{- with secret "kv/data/zabbix-mcp/prod" -}}{{ .Data.data.zabbix_api_token }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-zabbix_mcp_server__auth_token: "kv/data/zabbix-mcp/prod"
        vault.hashicorp.com/agent-inject-template-zabbix_mcp_server__auth_token: |
          {{- with secret "kv/data/zabbix-mcp/prod" -}}{{ .Data.data.mcp_bearer_token }}{{- end -}}
        # Settings are read at start-up: restart the pods (rollout restart) after rotating a secret.
        # Run the sidecar only at init so the app never starts without its secrets and no sidecar stays behind:
        vault.hashicorp.com/agent-pre-populate-only: "true"
    spec:
      serviceAccountName: zabbix-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zabbix-mcp-server
          image: ghcr.io/initmax/zabbix-mcp-server:latest   # build from the Dockerfile and push to your registry
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: zabbix-mcp-config }
            # Option B: secrets synced from Vault into a Kubernetes Secret.
            # - secretRef: { name: zabbix-mcp-secrets }
          env:
            - { name: ZABBIX_MCP_SECRETS_DIR, value: /vault/secrets }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zabbix-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-mcp-server
spec:
  selector: { app: zabbix-mcp-server }
  ports:
    - { name: http, port: 80, targetPort: http }
