#
# Usage:
#   cp .env.example .env                 # fill in your Zabbix URL + API token
#   docker compose up -d                 # start
#   docker compose logs -f               # view logs
#   docker compose down                  # stop
#
# Upgrade:
#   git pull
#   docker compose up -d --build
#

services:
  zabbix-mcp-server:
    build: .
    container_name: zabbix-mcp-server
    restart: unless-stopped
    # MCP_HOST - host interface to bind on the Docker host (default: 127.0.0.1)
    # MCP_PORT - port exposed on the Docker host (default: 8080)
    ports:
      - "${MCP_HOST:-127.0.0.1}:${MCP_PORT:-8080}:8080"
    # Every ZABBIX_MCP_* variable in .env reaches the server.
    env_file:
      - path: .env
        required: true
    healthcheck:
      test: ["CMD", "/opt/zabbix-mcp/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
