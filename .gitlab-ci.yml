include:
  - component: ${CI_SERVER_HOST}/devops-dbt/components/templates/default@3.1.0
  - component: ${CI_SERVER_HOST}/devops-dbt/components/templates/build@3.1.0
  - component: ${CI_SERVER_HOST}/devops-dbt/components/templates/scan@3.1.0
  - component: ${CI_SERVER_HOST}/devops-dbt/components/templates/k8s@3.1.0
    inputs:
      vault-path-secrets: "${K8S_NAMESPACE_BASE}/${PROJECT_NAME}/${ENVRM}"
  - component: ${CI_SERVER_HOST}/devops-dbt/components/templates/pipe-test@3.1.0
    inputs:
      context: SH_TEST
  - component: ${CI_SERVER_HOST}/devops-dbt/components/templates/pipe-prod@3.1.0
    inputs:
      context: SH_INT_R_PROD

stages: [build, scan, deploy, cleanup]

# Same pipeline as netbox-mcp (devnetops-mcp group), which builds and deploys.
variables:
  GROUP_NAME: "devnetops-mcp"
  PROJECT_NAME: $CI_PROJECT_NAME
  IMAGE_NAME: $CI_REGISTRY/$GROUP_NAME/$CI_PROJECT_NAME
  IMAGE_TAG: $ENVRM-$CI_PIPELINE_IID

  VAULT_URL: "https://vaultapi.sovcombank.group"
  VAULT_VER: "v2"
  DEPLOY_GET_SECRETS: "true"
  DEPLOY_ADDITION_FLAGS: "
    --atomic
    --wait
    --timeout 5m
    "

  # "true" makes the shared components trace every command and print the registry
  # password in the job log. Keep it off.
  DEBUG: "false"
