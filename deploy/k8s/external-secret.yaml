# Option B: External Secrets Operator copies the secrets from Vault into a
# Kubernetes Secret that the Deployment loads with envFrom.
# (With the Vault Secrets Operator use a VaultStaticSecret that writes the
# same Secret instead.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zabbix-mcp-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: zabbix-mcp-secrets
  data:
    - secretKey: ZABBIX_MCP_ZABBIX_SERVERS__PROD__API_TOKEN
      remoteRef: { key: kv/zabbix-mcp/prod, property: zabbix_api_token }
    - secretKey: ZABBIX_MCP_SERVER__AUTH_TOKEN
      remoteRef: { key: kv/zabbix-mcp/prod, property: mcp_bearer_token }
    # Optional: rotate the bearer token by itself.
    # - secretKey: ZABBIX_MCP_SERVER__AUTH_TOKEN_EXPIRES_AT
    #   remoteRef: { key: kv/zabbix-mcp/prod, property: mcp_bearer_token_expires_at }
